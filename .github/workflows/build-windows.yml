name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build standalone EXE (include PyMuPDF resources)
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name Flipkart_Splitter --collect-all pymupdf --collect-all fitz flipkart_splitter.py

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: Flipkart_Splitter_Windows_EXE
          path: dist/Flipkart_Splitter.exe
          if-no-files-found: error
          retention-days: 30
