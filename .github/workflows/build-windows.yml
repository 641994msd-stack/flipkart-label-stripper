
name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build EXE
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name Flipkart_Splitter flipkart_splitter.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: Flipkart_Splitter_Windows_EXE
          path: dist/Flipkart_Splitter.exe
          retention-days: 30
